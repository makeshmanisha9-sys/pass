  <!-- Global Error Logger -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error('Passage Runtime Error:', msg, 'at', url, lineNo);
      var errDiv = document.getElementById('passage-error-banner');
      if (!errDiv) {
        errDiv = document.createElement('div');
        errDiv.id = 'passage-error-banner';
        errDiv.style = 'position:fixed;bottom:10px;right:10px;background:#ef4444;color:white;padding:12px;border-radius:12px;z-index:99999;font-size:12px;font-weight:bold;box-shadow:0 10px 25px rgba(0,0,0,0.3);';
        document.body.appendChild(errDiv);
      }
      errDiv.innerHTML = '⚠️ App Error: ' + msg + ' (Line ' + lineNo + ')';
      return false;
    };
  </script>
